<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸运大转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow-y: auto;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 30px 20px;
  }

  .title {
    font-size: 36px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(255,215,0,0.3);
    letter-spacing: 6px;
  }

  .wheel-wrapper {
    position: relative;
    width: 440px;
    height: 440px;
  }

  canvas {
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255,215,0,0.3), 0 0 80px rgba(255,215,0,0.1);
  }

  /* 指针 */
  .pointer {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 48px solid #FF1744;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    animation: bounce 1.5s ease-in-out infinite;
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -56px;
    left: -14px;
    width: 28px;
    height: 28px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255,215,0,0.8);
  }
  @keyframes bounce {
    0%, 100% { top: -30px; }
    50% { top: -36px; }
  }

  /* 中心按钮 */
  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF1744, #D50000);
    border: 4px solid #FFD700;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    z-index: 5;
    letter-spacing: 4px;
    box-shadow: 0 0 20px rgba(255,23,68,0.6), 0 6px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .center-btn:hover {
    transform: translate(-50%, -50%) scale(1.08);
  }
  .center-btn:active {
    transform: translate(-50%, -50%) scale(0.93);
  }
  .center-btn.spinning {
    pointer-events: none;
    opacity: 0.6;
  }

  /* 弹窗 */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.72);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.25s ease;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .prize-dialog {
    position: relative;
    background: linear-gradient(135deg, #fff9c4, #fff176);
    border: 5px solid #FF6F00;
    border-radius: 24px;
    padding: 40px 44px 34px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 360px;
    width: 90%;
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .prize-emoji {
    font-size: 68px;
    margin-bottom: 4px;
  }

  .prize-label {
    font-size: 18px;
    color: #E65100;
    font-weight: 700;
    margin: 6px 0;
  }

  .prize-name {
    font-size: 34px;
    font-weight: 900;
    color: #D50000;
    margin: 8px 0 20px;
  }

  .close-btn {
    background: linear-gradient(135deg, #FF6F00, #E65100);
    color: #fff;
    border: none;
    padding: 12px 50px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 3px;
    box-shadow: 0 6px 16px rgba(230,81,0,0.4);
  }
  .close-btn:hover { transform: translateY(-2px); }
  .close-btn:active { transform: translateY(0); }

  /* 彩纸 */
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 3px;
    animation: confettiFall var(--fall-dur) linear forwards;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(480px) rotate(720deg) scale(0.2); opacity: 0; }
  }

  /* 响应式 */
  @media (max-width: 500px) {
    .wheel-wrapper { width: 340px; height: 340px; }
    canvas { width: 340px; height: 340px; }
    .title { font-size: 24px; letter-spacing: 3px; }
    .center-btn { width: 70px; height: 70px; font-size: 16px; }
    .pointer { border-left-width: 18px; border-right-width: 18px; border-top-width: 38px; top: -24px; }
    .pointer::after { top: -46px; left: -12px; width: 24px; height: 24px; }
  }
</style>
</head>
<body>

<div class="main-container">
  <div class="title">幸运大转盘</div>

  <div class="wheel-wrapper" id="wheelWrapper">
    <canvas id="wheelCanvas" width="440" height="440"></canvas>
    <div class="pointer"></div>
    <button class="center-btn" id="spinBtn" onclick="spin()">抽 奖</button>
  </div>
</div>

<!-- 弹窗 -->
<div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeDialog()">
  <div class="prize-dialog" id="prizeDialog">
    <div class="prize-emoji" id="prizeEmoji"></div>
    <div class="prize-label">恭喜你!</div>
    <div class="prize-name" id="prizeName"></div>
    <button class="close-btn" onclick="closeDialog()">好 的</button>
  </div>
</div>

<script>
// ==================== 数据 ====================
var prizes = [
  { name: '红包 5.55元', icon: '🧧', color: '#E74C3C' },
  { name: '红包 2.88元', icon: '🧧', color: '#F39C12' },
  { name: '红包 5.88元', icon: '💵', color: '#27AE60' },
  { name: '红包 8.88元', icon: '💰', color: '#2980B9' },
  { name: '奶茶一杯',   icon: '🧋', color: '#8E44AD' },
  { name: '小蛋糕一个', icon: '🍰', color: '#E91E63' },
  { name: '再来一次',   icon: '🔄', color: '#00BCD4' }
];
var n = 7;
var segAngle = (2 * Math.PI) / n;

// ==================== Canvas ====================
var canvas = document.getElementById('wheelCanvas');
var ctx = canvas.getContext('2d');
var size = canvas.width;
var cx = size / 2;
var cy = size / 2;
var radius = size / 2 - 4;

var currentAngle = 0;
var spinning = false;

function drawWheel(rotation) {
  ctx.clearRect(0, 0, size, size);

  // 画6个扇形
  for (var i = 0; i < n; i++) {
    var startA = rotation + i * segAngle - Math.PI / 2;
    var endA = startA + segAngle;

    // 扇形
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startA, endA);
    ctx.closePath();
    ctx.fillStyle = prizes[i].color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 文字 - 放在扇形中心，不旋转
    var midA = startA + segAngle / 2;
    var textR = radius * 0.6;
    var tx = cx + textR * Math.cos(midA);
    var ty = cy + textR * Math.sin(midA);

    // 编号
    ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 4;
    ctx.fillText('[' + (i+1) + ']', tx, ty - 14);

    // 奖品名
    ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
    ctx.shadowBlur = 3;
    ctx.fillText(prizes[i].name, tx, ty + 16);
    ctx.shadowBlur = 0;
  }

  // 白色分隔线
  for (var j = 0; j < n; j++) {
    var lineA = rotation + j * segAngle - Math.PI / 2;
    var lx = cx + radius * Math.cos(lineA);
    var ly = cy + radius * Math.sin(lineA);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(lx, ly);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // 中心圆
  var grad = ctx.createRadialGradient(cx, cy, 28, cx, cy, 56);
  grad.addColorStop(0, '#FFD700');
  grad.addColorStop(0.5, '#FFA000');
  grad.addColorStop(1, '#BF360C');
  ctx.beginPath();
  ctx.arc(cx, cy, 54, 0, 2 * Math.PI);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.stroke();
}

// 初始绘制
drawWheel(0);

// ==================== 音效 ====================
function playWinSound() {
  try {
    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523.25, 659.25, 783.99, 1046.50];
    var dur = 0.15;

    notes.forEach(function(freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;

      var t0 = audioCtx.currentTime + i * dur;
      var t1 = t0 + dur + 0.1;

      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.linearRampToValueAtTime(0.15, t0 + dur);
      gain.gain.linearRampToValueAtTime(0, t1);

      osc.start(t0);
      osc.stop(t1);
    });
  } catch(e) {}
}

// ==================== 旋转 ====================
function spin() {
  if (spinning) return;
  spinning = true;

  var btn = document.getElementById('spinBtn');
  btn.classList.add('spinning');
  btn.textContent = '...';

  var extraRotations = 5 + Math.floor(Math.random() * 4);
  var randomAngle = Math.random() * 2 * Math.PI;
  var totalDelta = extraRotations * 2 * Math.PI + randomAngle;

  var startAngle = currentAngle;
  var targetAngle = currentAngle + totalDelta;
  var duration = 4000 + Math.random() * 1500;
  var startTime = performance.now();

  function animate(now) {
    var elapsed = now - startTime;
    var progress = Math.min(elapsed / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3.5);

    currentAngle = startAngle + totalDelta * eased;
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = targetAngle;
      drawWheel(currentAngle);
      spinning = false;
      btn.classList.remove('spinning');
      btn.textContent = '抽 奖';

      // 计算中奖结果
      var norm = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      var ptrAngle = -Math.PI / 2;
      var rel = (ptrAngle - norm + 2 * Math.PI) % (2 * Math.PI);
      var idx = Math.floor(rel / segAngle) % n;

      showPrize(idx);
    }
  }

  requestAnimationFrame(animate);
}

// ==================== 弹窗 ====================
function showPrize(idx) {
  var prize = prizes[idx];
  playWinSound();
  spawnConfetti();

  document.getElementById('prizeEmoji').textContent = prize.icon;
  document.getElementById('prizeName').textContent = prize.name;
  document.getElementById('overlay').classList.remove('hidden');
}

function closeDialog() {
  document.getElementById('overlay').classList.add('hidden');
}

// ==================== 彩纸 ====================
function spawnConfetti() {
  var colors = ['#FF1744','#FFD700','#00E676','#2979FF','#FF6D00','#D500F9','#00E5FF','#FF4081'];
  var dialog = document.getElementById('prizeDialog');
  var frag = document.createDocumentFragment();

  for (var i = 0; i < 50; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = -(Math.random() * 40 + 10) + 'px';
    piece.style.width = (Math.random() * 10 + 6) + 'px';
    piece.style.height = (Math.random() * 10 + 6) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--fall-dur', (Math.random() * 1.5 + 1.5) + 's');
    piece.style.animationDelay = Math.random() * 0.4 + 's';
    frag.appendChild(piece);

    setTimeout(function() { piece.remove(); }, 2500);
  }
  dialog.appendChild(frag);
}
</script>
</body>
</html>
