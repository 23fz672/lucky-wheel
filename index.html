<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧋 今天喝什么</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(ellipse at center, #2d1810 0%, #1a0e08 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow-y: auto; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .main-container { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px; }
  .title {
    font-size: 30px; font-weight: 900; color: #F5DEB3;
    text-shadow: 0 0 20px rgba(245,222,179,0.6), 0 0 40px rgba(245,222,179,0.3);
    letter-spacing: 6px;
  }
  .wheel-wrapper { position: relative; width: 440px; height: 440px; }
  canvas {
    display: block; border-radius: 50%;
    box-shadow: 0 0 40px rgba(245,222,179,0.3), 0 0 80px rgba(245,222,179,0.1);
  }
  .pointer {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%); z-index: 10;
    width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent;
    border-top: 44px solid #C62828;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    animation: bounce 1.5s ease-in-out infinite;
  }
  .pointer::after {
    content: ''; position: absolute; top: -52px; left: -12px;
    width: 24px; height: 24px; background: #FFD700; border-radius: 50%;
    box-shadow: 0 0 12px rgba(255,215,0,0.8);
  }
  @keyframes bounce { 0%, 100% { top: -30px; } 50% { top: -36px; } }
  .center-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 85px; height: 85px; border-radius: 50%;
    background: linear-gradient(135deg, #C62828, #8B0000);
    border: 4px solid #FFD700; color: #fff; font-size: 18px; font-weight: 900;
    cursor: pointer; z-index: 5; letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(198,40,40,0.6), 0 6px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .center-btn:hover { transform: translate(-50%, -50%) scale(1.08); }
  .center-btn:active { transform: translate(-50%, -50%) scale(0.93); }
  .center-btn.spinning { pointer-events: none; opacity: 0.6; }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.72); z-index: 100;
    display: flex; justify-content: center; align-items: center;
    animation: fadeIn 0.25s ease;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .prize-dialog {
    position: relative;
    background: linear-gradient(135deg, #FFF8E1, #FFE0B2);
    border: 5px solid #8D6E63; border-radius: 24px;
    padding: 36px 36px 28px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 360px; width: 90%;
  }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .prize-emoji { font-size: 64px; margin-bottom: 4px; }
  .prize-label { font-size: 16px; color: #6D4C41; font-weight: 700; margin: 4px 0; }
  .prize-name { font-size: 28px; font-weight: 900; color: #BF360C; margin: 8px 0 20px; }
  .close-btn {
    background: linear-gradient(135deg, #8D6E63, #5D4037);
    color: #fff; border: none; padding: 12px 48px; border-radius: 50px;
    font-size: 18px; font-weight: 700; cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 6px 16px rgba(93,64,55,0.4);
  }
  .close-btn:hover { transform: translateY(-2px); }
  .close-btn:active { transform: translateY(0); }
  .confetti-piece {
    position: absolute; border-radius: 3px; pointer-events: none;
    animation: confettiFall var(--fall-dur) linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(480px) rotate(720deg) scale(0.2); opacity: 0; }
  }
  @media (max-width: 500px) {
    .wheel-wrapper { width: 340px; height: 340px; }
    canvas { width: 340px; height: 340px; }
    .title { font-size: 22px; letter-spacing: 3px; }
    .center-btn { width: 68px; height: 68px; font-size: 15px; }
    .pointer { border-left-width: 16px; border-right-width: 16px; border-top-width: 34px; top: -22px; }
    .pointer::after { top: -42px; left: -10px; width: 20px; height: 20px; }
    .prize-name { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="main-container">
  <div class="title">🧋 今天喝什么</div>
  <div class="wheel-wrapper" id="wheelWrapper">
    <canvas id="wheelCanvas" width="440" height="440"></canvas>
    <div class="pointer"></div>
    <button class="center-btn" id="spinBtn" onclick="spin()">选 茶</button>
  </div>
</div>

<div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeDialog()">
  <div class="prize-dialog" id="prizeDialog">
    <div class="prize-emoji" id="prizeEmoji"></div>
    <div class="prize-label">🎉 今天就喝它！</div>
    <div class="prize-name" id="prizeName"></div>
    <button class="close-btn" onclick="closeDialog()">好 的</button>
  </div>
</div>

<script>
var prizes = [
  { brand: '喜茶',          drink: '烤黑糖波波牛乳', icon: '🟤', color: '#D84315' },
  { brand: '古茗',          drink: '超A芝士葡萄',     icon: '🟣', color: '#7B1FA2' },
  { brand: '一点点',        drink: '冰淇淋红茶',       icon: '🟠', color: '#EF6C00' },
  { brand: '茶百道',        drink: '豆乳玉麒麟',       icon: '🟡', color: '#F9A825' },
  { brand: '茉莉奶白',      drink: '针王苹果',         icon: '⚪', color: '#78909C' },
  { brand: '爷爷不泡茶',    drink: '兰香青柠',         icon: '🟢', color: '#2E7D32' },
  { brand: '沪上阿姨',      drink: '草莓大福',         icon: '🔴', color: '#C62828' },
  { brand: 'OT另茶',        drink: '泰式咸法酪',       icon: '🟤', color: '#4E342E' },
  { brand: '裕莲茶楼',      drink: '特浓茶钻琥珀奶',   icon: '🟠', color: '#BF360C' }
];
var n = 9;
var segAngle = (2 * Math.PI) / n;

var canvas = document.getElementById('wheelCanvas');
var ctx = canvas.getContext('2d');
var size = canvas.width, cx = size / 2, cy = size / 2, radius = size / 2 - 4;
var currentAngle = 0, spinning = false;

function drawWheel(rotation) {
  ctx.clearRect(0, 0, size, size);
  for (var i = 0; i < n; i++) {
    var startA = rotation + i * segAngle - Math.PI / 2;
    var endA = startA + segAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startA, endA);
    ctx.closePath();
    ctx.fillStyle = prizes[i].color;
    ctx.fill();
    ctx.strokeStyle = '#FFF8E1';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    var midA = startA + segAngle / 2;
    var textR = radius * 0.58;
    var tx = cx + textR * Math.cos(midA);
    var ty = cy + textR * Math.sin(midA);

    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.fillText(prizes[i].brand, tx, ty - 12);
    ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.fillText(prizes[i].drink, tx, ty + 14);
    ctx.shadowBlur = 0;
  }

  for (var j = 0; j < n; j++) {
    var lineA = rotation + j * segAngle - Math.PI / 2;
    var lx = cx + radius * Math.cos(lineA), ly = cy + radius * Math.sin(lineA);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(lx, ly);
    ctx.strokeStyle = '#FFF8E1'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  var grad = ctx.createRadialGradient(cx, cy, 24, cx, cy, 52);
  grad.addColorStop(0, '#FFD700'); grad.addColorStop(0.5, '#C62828'); grad.addColorStop(1, '#4E342E');
  ctx.beginPath(); ctx.arc(cx, cy, 50, 0, 2 * Math.PI);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; ctx.stroke();
}
drawWheel(0);

function playWinSound() {
  try {
    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function(freq, i) {
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle'; osc.frequency.value = freq;
      var t0 = audioCtx.currentTime + i * 0.15, t1 = t0 + 0.25;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.linearRampToValueAtTime(0.15, t0 + 0.15);
      gain.gain.linearRampToValueAtTime(0, t1);
      osc.start(t0); osc.stop(t1);
    });
  } catch(e) {}
}

function spin() {
  if (spinning) return; spinning = true;
  var btn = document.getElementById('spinBtn');
  btn.classList.add('spinning'); btn.textContent = '...';

  var extra = 5 + Math.floor(Math.random() * 4);
  var totalDelta = extra * 2 * Math.PI + Math.random() * 2 * Math.PI;
  var startAngle = currentAngle, targetAngle = currentAngle + totalDelta;
  var duration = 4000 + Math.random() * 1500, startTime = performance.now();

  function animate(now) {
    var progress = Math.min((now - startTime) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3.5);
    currentAngle = startAngle + totalDelta * eased;
    drawWheel(currentAngle);
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = targetAngle; drawWheel(currentAngle);
      spinning = false;
      btn.classList.remove('spinning'); btn.textContent = '选 茶';
      var norm = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      var rel = (-Math.PI / 2 - norm + 2 * Math.PI) % (2 * Math.PI);
      var idx = Math.floor(rel / segAngle) % n;
      showPrize(idx);
    }
  }
  requestAnimationFrame(animate);
}

function showPrize(idx) {
  var p = prizes[idx];
  playWinSound(); spawnConfetti();
  document.getElementById('prizeEmoji').textContent = p.icon;
  document.getElementById('prizeName').innerHTML = p.brand + '<br><small style="font-size:19px;color:#6D4C41;">' + p.drink + '</small>';
  document.getElementById('overlay').classList.remove('hidden');
}

function closeDialog() { document.getElementById('overlay').classList.add('hidden'); }

function spawnConfetti() {
  var colors = ['#D84315','#FFD700','#7B1FA2','#EF6C00','#2E7D32','#F9A825','#C62828','#BF360C'];
  var dialog = document.getElementById('prizeDialog'), frag = document.createDocumentFragment();
  for (var i = 0; i < 45; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = -(Math.random() * 40 + 10) + 'px';
    piece.style.width = (Math.random() * 10 + 6) + 'px';
    piece.style.height = (Math.random() * 10 + 6) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--fall-dur', (Math.random() * 1.5 + 1.5) + 's');
    piece.style.animationDelay = Math.random() * 0.4 + 's';
    frag.appendChild(piece);
    setTimeout(function() { piece.remove(); }, 2500);
  }
  dialog.appendChild(frag);
}
</script>
</body>
</html>
